<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Everyday Comfort Tee | GUNI Store</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" defer></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
	
	<link href="css/styles.css" rel="stylesheet">
</head>

<body>
	<header class="site-navbar navbar navbar-expand-md">
		<div class="container-fluid">
			<a href="index.html" class="logo-primary">
				<img src="images/logo-primary.png" alt="GUNI Store" class="logo-primary"></a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" aria-controls="main-navigation" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>


		<nav id="main-navigation" class="collapse navbar-collapse" aria-label="Main navigation">
			<ul class="navbar-nav ms-auto">
				<li class="nav-item">
					<a class="nav-link" href="index.html">Home</a></li>
				<li class="nav-item">
					<a class="nav-link active" href="shop.html" aria-current="page">Shop</a></li>
				<li class="nav-item">
					<a class="nav-link" href="about.html">About</a></li>
				<li class="nav-item">
					<a class="nav-link" href="contact.html">Contact</a></li>
			</ul>
		</nav>
		</div>
	</header>

<main>
	<section class="product-page" data-product-name="Everyday Comfort Tee" data-product-price="₱250">

		<div class="product-gallery">
			<div class="product-image">
				<img id="product-main-image" src="images/everyday-comfort-tee.png" alt="Front view of the GUNI Everyday Comfort Tee"></div>
				<button type="button" class="gallery-arrow previous" id="gallery-prev" aria-label="Previous product image">&#8249;</button>
				<button type="button" class="gallery-arrow next" id="gallery-next" aria-label="Next product image">&#8250;</button>
			</div>


			<div class="thumbnail-list" aria-label="Product images">
					<button type="button"
						class="thumbnail is-selected"
						data-image="images/everyday-comfort-tee.png"
						data-alt="Everyday Comfort Tee Small size" aria-label="View Small size" aria-pressed="true">
						<img src="images/everyday-comfort-tee.png" alt="GUNI Everyday Comfort Tee, Small size">
					</button>

					<button type="button"
						class="thumbnail"
						data-image="images/everyday-comfort-tee.png"
						data-alt="Everyday Comfort Medium Size" aria-label="View Medium Size" aria-pressed="false">
						<img src="images/everyday-comfort-tee.png" alt="GUNI Everyday Comfort Tee, Medium size">
					</button>	

					<button type="button"
						class="thumbnail"
						data-image="images/everyday-comfort-tee.png" data-alt="Everyday Comfort Tee Large Size" aria-label="View Large Size" aria-pressed="false">
						<img src="images/everyday-comfort-tee.png" alt="GUNI Everyday Comfort Tee, Large size">
					</button>

					<button type="button"
						class="thumbnail"
						data-image="images/everyday-comfort-tee.png" data-alt="Everyday Comfort Tee XL Size" aria-label="View XL Size" aria-pressed="false">
						<img src="images/everyday-comfort-tee.png" alt="GUNI Everyday Comfort Tee, XL size">
					</button>
			</div>
		</div>


		<div class="product-info">
			<h1>Everyday Comfort Tee</h1>
			<p class="product-price">₱499</p>
			<p class="product-description">Description TBA for design.</p>


			<fieldset class="size-selection">
			<legend>Size</legend>
				<div class="size-options">
					<button type="button" class="size-option" data-size="S" aria-pressed="false">S</button>
					<button type="button" class="size-option" data-size="M" aria-pressed="false">M</button>
					<button type="button" class="size-option" data-size="L" aria-pressed="false">L</button>
					<button type="button" class="size-option" data-size="XL" aria-pressed="false">XL</button>
				</div>
			</fieldset>
			<input type="hidden" id="size" name="size" value="">


			<div class="modal-fade" id="order-modal" tabindex="-1" aria-labelledby="order-modal-title" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h2 class="modal-title fs-5" id="order-modal-title">Confirm Your Order</h2>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>


				<div class="quantity-selection">
					<label for="quantity">Quantity</label>
					<div class="quantity-control">
						<button type="button" id="quantity-decrease" aria-label="Decrease quantity">-</button>
						<input type="number" id="quantity" name="quantity" min="1" value="1">
						<button type="button" id="quantity-increase" aria-label="Increase quantity">+</button>
					</div>
				</div>

				<button type="button" id="order-btn">ORDER NOW</button>
				<p id="order-feedback" aria-live="polite"></p>

				<div class="accordion product-accordion" id="product-accordion">
					<div class="accordion-item">
						<h2 class="accordion-header" id="heading-details">
							<button type="button"
								class="accordion-button collapsed"
								data-bs-toggle="collapse"
				                                data-bs-target="#product-details"
								aria-expanded="false"
								aria-controls="product-details">Product Details</button></h2>
					<div class="accordion-collapse collapse" id="product-details" aria-labelledby="heading-details" data-bs-parent="#product-accordion">
						<div class="accordion-body">
							<p>Product details go here.</p>
						</div>
					</div>
				</div>

					<div class="accordion-item">
						<h2 class="accordion-header" id="heading-care">
							<button type="button"
								class="accordion-button collapsed"
								data-bs-toggle="collapse"
				                                data-bs-target="#care-instructions"
								aria-expanded="false"
								aria-controls="care-instructions">Care Instructions</button></h2>
					<div class="accordion-collapse collapse" id="care-instructions" aria-labelledby="heading-care" data-bs-parent="#product-accordion">
						<div class="accordion-body">
							<p>Care instructions TBA.</p>
						</div>
					</div>
				</div>


					<div class="accordion-item">
						<h2 class="accordion-header" id="heading-shipping">
							<button type="button"
								class="accordion-button collapsed"
								data-bs-toggle="collapse"
				                                data-bs-target="#shipping-information"
								aria-expanded="false"
								aria-controls="shipping-information">Shipping Information</button></h2>
					<div class="accordion-collapse collapse" id="shipping-information" aria-labelledby="heading-shipping" data-bs-parent="#product-accordion">
						<div class="accordion-body">
							<p>Shipping information TBA.</p>
						</div>
					</div>
				</div>

	</section>
</main>

<footer class="site-footer">
	<p style="text-align: center;">&copy; Guni. All rights reserved.</p>
	<div class="logo-secondary">
		<img src="images/logo-secondary.png" alt="Guni Store logo" class="logo-footer">
	</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous" defer></script>
<script src="js/product.js" defer></script>

</body>
</html>
